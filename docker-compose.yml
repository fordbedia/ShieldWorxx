name: jobguard

networks:
  fordbedia_reverse_proxy:
    external: true
  shared_db:
    external: true

services:
  app:
    build: .
    container_name: jobguard-web
    command: gunicorn jobguard.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file: .env
    networks:
      - fordbedia_reverse_proxy
      - shared_db
    restart: unless-stopped